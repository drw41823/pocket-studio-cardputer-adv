[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
upload_speed = 460800
monitor_speed = 115200
build_src_flags = -mtext-section-literals
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    arduino-irremote/IRremote@4.7.1
    https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01

